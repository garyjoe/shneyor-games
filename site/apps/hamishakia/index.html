<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>המשחקייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;800&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ground:#150E2B;
    --ground-2:#221845;
    --ground-3:#2c2154;
    --line:#342a5c;
    --ink:#F6EEDF;
    --muted:#9C91BF;
    --hit:#FFB020;
    --decoy:#35D6C8;
    --bonus:#FF5C8A;
    --a4:#8B7FFF;
    --a5:#6FDD8B;
    --a6:#5FA8FF;
    --a7:#FFD65C;
    --display:"Karantina","Arial Narrow",Impact,sans-serif;
    --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);direction:rtl;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit}
  .shell{height:100%;box-sizing:border-box;max-width:960px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 16px;gap:10px}

  /* shared top bar */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
  .iconbtn{
    width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
    background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;
  }
  .iconbtn:hover{color:var(--ink)}
  .iconbtn:focus-visible{outline:3px solid var(--decoy);outline-offset:3px}
  .iconbtn svg{width:20px;height:20px}
  .mute .off{display:none}
  .mute[aria-pressed="true"] .on{display:none}
  .mute[aria-pressed="true"] .off{display:block}
  .sitetitle{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em}
  .backbtn{transform:scaleX(-1)}

  main#stage{flex:1;min-height:0;display:flex;flex-direction:column}

  /* home */
  #home{flex:1;min-height:0;overflow:auto}
  .lede{margin:2px 0 16px;color:var(--muted);font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
  .card-btn{
    all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:18px;
    padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--ground-2);
    transition:transform .12s ease,border-color .12s ease;
  }
  .card-btn:hover,.card-btn:focus-visible{border-color:var(--hit);transform:translateY(-3px)}
  .card-btn:focus-visible{outline:3px solid var(--decoy);outline-offset:2px}
  .card-ico{width:46px;height:46px}
  .card-name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
  .card-tag{font-size:13px;color:var(--muted);line-height:1.3}
  .card-best{align-self:flex-start;font-size:12px;font-weight:700;background:var(--ground-3);color:var(--muted);padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
  .card-best b{color:var(--hit);font-weight:800}

  /* game host */
  #gameHost{flex:1;min-height:0;display:flex;flex-direction:column}
  .arena{
    flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;
    border:1px solid var(--line);
    background:radial-gradient(120% 90% at 50% 110%, #2a1d57 0%, transparent 60%), var(--ground);
  }
  .hud{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:16px;flex:0 0 auto;padding-bottom:8px}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:64px}
  .stat .label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
  .stat .val{font-family:var(--display);font-weight:700;font-size:40px;line-height:.85;font-variant-numeric:tabular-nums}
  .stat.end{text-align:left;align-items:flex-end}
  .stat.end .val{color:var(--hit);transition:transform .12s}
  .stat.end .val.bump{transform:scale(1.3)}
  .stat.end .sub{font-size:12px;color:var(--muted);font-weight:600}
  .clock{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
  .clock .secs{font-family:var(--display);font-size:24px;line-height:.8;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar{height:9px;border-radius:99px;background:var(--ground-2);overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:var(--hit);transform-origin:right center;transition:background-color .2s}
  .bar.low i{background:var(--bonus)}

  .flash{position:absolute;inset:0;pointer-events:none}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .card{
    width:100%;max-width:420px;box-sizing:border-box;
    background:color-mix(in srgb,var(--ground) 82%,transparent);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:22px;padding:24px 22px;
    display:flex;flex-direction:column;gap:16px;
  }
  .logo{font-family:var(--display);font-weight:700;font-size:clamp(64px,18vw,110px);line-height:.78;color:var(--hit);text-align:center;margin:0;text-shadow:0 0 34px color-mix(in srgb,var(--hit) 45%,transparent)}
  .tag{text-align:center;margin:0;font-size:17px;font-weight:600}
  .tag span{color:var(--muted);font-weight:400}
  .rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .rules li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;font-size:14px;line-height:1.35}
  .rules b{font-weight:800}
  .rules .sub{color:var(--muted)}
  .ico{width:32px;height:32px;display:grid;place-items:center}
  .ico svg{width:26px;height:26px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .best{font-size:13px;color:var(--muted)}
  .best b{font-family:var(--display);font-size:24px;color:var(--ink);font-weight:700;margin-inline-start:4px;font-variant-numeric:tabular-nums}
  .btn{
    font-family:var(--body);font-weight:800;font-size:18px;color:var(--ground);background:var(--hit);
    border:0;border-radius:14px;padding:13px 26px;cursor:pointer;
    box-shadow:0 6px 0 #b8750a;transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8750a}
  .btn:focus-visible{outline:3px solid var(--decoy);outline-offset:3px}
  .btn kbd{font-family:var(--body);font-weight:600;font-size:12px;opacity:.65;margin-inline-start:8px}
  .record{align-self:center;background:var(--bonus);color:var(--ground);font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .grid2 div{background:var(--ground);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
  .grid2 .l{font-size:12px;color:var(--muted);font-weight:600}
  .grid2 .n{font-family:var(--display);font-size:28px;line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
  .grid2 .n small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-inline-start:3px}
  .big{display:flex;flex-direction:column;align-items:center;gap:0}
  .big .n{font-family:var(--display);font-weight:700;font-size:60px;line-height:.85;font-variant-numeric:tabular-nums}
  .big .l{font-size:13px;color:var(--muted);font-weight:600}
  .rank{font-family:var(--display);font-weight:700;font-size:clamp(60px,16vw,88px);line-height:.75;color:var(--hit);text-align:center;margin:4px 0 0}
  .rank-line{margin:0;text-align:center;color:var(--muted);font-size:15px}

  canvas.gcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .count{font-family:var(--display);font-weight:700;font-size:clamp(120px,36vw,220px);color:var(--ink);line-height:1;pointer-events:none}
  .count.pop{animation:pop .6s ease-out}
  @keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.15}}

  /* memory game */
  .mem-wrap{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;align-items:center;justify-content:center}
  .mem-grid{width:min(96%,640px);height:min(100%,640px);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(8px,2.2vw,16px);aspect-ratio:1;perspective:1000px}
  .mem-card{position:relative;border-radius:14px;cursor:pointer;transition:transform .1s}
  .mem-card:not(.flip):not(.matched):hover .mem-inner{transform:scale(1.035)}
  .mem-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.4,.2,.2,1)}
  .mem-card.flip .mem-inner{transform:rotateY(180deg)}
  .mem-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .mem-back{background:linear-gradient(150deg,var(--ground-3),var(--ground-2));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 3px 8px rgba(0,0,0,.35)}
  .mem-back svg{width:40%;height:40%;opacity:.45}
  .mem-front{background:var(--tint,var(--ground-2));transform:rotateY(180deg);border:1px solid var(--line-tint,var(--line));box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .mem-front svg{width:58%;height:58%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .mem-card.matched .mem-inner{transform:rotateY(180deg) scale(.94)}
  .mem-card.matched .mem-front{opacity:.7}
  .mem-card.matched{cursor:default}

  /* 2048 */
  p2048-wrap{}
  .p-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:0;justify-content:center}
  .p-board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;background:var(--ground-2);border-radius:16px;padding:10px;box-sizing:border-box;width:100%;max-width:420px;aspect-ratio:1}
  .p-cell{border-radius:10px;background:color-mix(in srgb,var(--ground) 55%,var(--ground-2))}
  .p-tile{border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(18px,6.5vw,38px);animation:tilein .12s ease-out}
  @keyframes tilein{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}
  .p-hint{font-size:13px;color:var(--muted);text-align:center}

  /* simon */
  .sim-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
  .sim-pads{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;width:min(78vw,320px);aspect-ratio:1}
  .sim-pad{border:0;border-radius:22px;cursor:pointer;opacity:.55;transition:opacity .08s,transform .08s}
  .sim-pad.lit{opacity:1;transform:scale(.97)}
  .sim-pad:nth-child(1){background:var(--hit);border-radius:22px 6px 6px 6px}
  .sim-pad:nth-child(2){background:var(--decoy);border-radius:6px 22px 6px 6px}
  .sim-pad:nth-child(3){background:var(--bonus);border-radius:6px 6px 6px 22px}
  .sim-pad:nth-child(4){background:var(--a4);border-radius:6px 6px 22px 6px}
  .sim-status{font-size:15px;color:var(--muted);text-align:center;min-height:20px}
  .sim-status b{color:var(--ink)}

  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:active{transform:translateY(2px)}
  .choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .prompt{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,68px);text-align:center;margin:0;line-height:1}
  .subprompt{text-align:center;color:var(--muted);font-size:15px;margin:0}
  .board3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(88%,340px);aspect-ratio:1;margin:0 auto}
  .cell3{background:var(--ground-2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(28px,10vw,54px);cursor:pointer}
  .board5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(88%,360px);aspect-ratio:1;margin:0 auto}
  .cell5{border-radius:10px;cursor:pointer;background:var(--ground-2);border:1px solid var(--line);transition:background .15s}
  .cell5.on{background:var(--hit);box-shadow:0 0 16px color-mix(in srgb,var(--hit) 60%,transparent)}
  .moleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(88%,380px);aspect-ratio:1;margin:0 auto}
  .moleHole{border-radius:50%;background:var(--ground-2);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mole{width:68%;height:68%;border-radius:50%;background:var(--hit);transform:scale(0);transition:transform .12s}
  .moleHole.up .mole{transform:scale(1)}
  .card-suit{font-size:15px;color:var(--muted)}
  .cardface{width:min(50%,140px);aspect-ratio:2/3;margin:0 auto;background:var(--ground-2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .cardface .n{font-family:var(--display);font-size:clamp(36px,10vw,56px);line-height:1}
  .swatchrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .swatch{width:56px;height:56px;border-radius:14px;border:0;cursor:pointer}
  .swatch:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .c4Board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--ground-3);border-radius:16px;padding:10px;width:min(96%,440px);aspect-ratio:7/6.4;margin:0 auto}
  .c4Cell{border-radius:50%;background:var(--ground);cursor:pointer;transition:background .1s}
  .c4Cell.p1{background:var(--hit)}
  .c4Cell.p2{background:var(--decoy)}
  .pzGrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;width:min(90%,360px);aspect-ratio:1;margin:0 auto}
  .pzTile{background:var(--ground-2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(20px,7vw,32px);cursor:pointer}
  .pzTile.empty{background:transparent;border:0;cursor:default}
  .crGrid{display:grid;gap:8px;width:min(90%,380px);margin:0 auto}
  .crCell{aspect-ratio:1;border-radius:10px;cursor:pointer;border:0}
  .oooGrid{display:grid;gap:10px;width:min(90%,360px);margin:0 auto}
  .oooCell{aspect-ratio:1;border-radius:50%;cursor:pointer;border:0}
  .bsGrid{display:grid;gap:6px;width:min(92%,380px);margin:0 auto}
  .bsCell{aspect-ratio:1;border-radius:8px;cursor:pointer;border:0;background:var(--ground-2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
  .bsCell.hit{background:var(--hit)}
  .bsCell.miss{background:var(--ground-3);cursor:default}
  .mmSlots{display:flex;gap:8px;justify-content:center}
  .mmSlot{width:40px;height:40px;border-radius:50%;background:var(--ground-2);border:2px dashed var(--line)}
  .mmSwatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .mmSwatch{width:44px;height:44px;border-radius:50%;cursor:pointer;border:0}
  .mmRow{display:flex;gap:10px;align-items:center;justify-content:center;padding:4px 0}
  .mmPegs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;width:16px}
  .mmPeg{width:7px;height:7px;border-radius:50%}
  .sdGrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px;width:min(64%,240px);margin:0 auto;background:var(--ground-3);padding:6px;border-radius:12px}
  .sdCell{background:var(--ground-2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px}
  .sdCell.blank{background:var(--ground);border:2px dashed var(--line)}
  .cupRow{display:flex;gap:18px;justify-content:center;align-items:flex-end}
  .cup{width:70px;height:70px;cursor:pointer;transition:transform .5s ease}
  .slotRow{display:flex;gap:10px;justify-content:center}
  .slotReel{width:70px;height:90px;background:var(--ground-2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
  .slBoard{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(94%,420px);aspect-ratio:1;margin:0 auto;background:var(--ground-3);padding:4px;border-radius:10px}
  .slCell{background:var(--ground-2);border-radius:4px;font-size:9px;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px;position:relative;color:var(--muted);font-weight:700}
  .slToken{width:14px;height:14px;border-radius:50%;position:absolute;bottom:2px;right:2px}
  .hmKeyboard{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(94%,420px);margin:0 auto}
  .hmKey{width:34px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--ground-2);color:var(--ink);font-weight:700;cursor:pointer}
  .hmKey:disabled{opacity:.3;cursor:default}
  .nimRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .nimStone{width:24px;height:24px;border-radius:50%;background:var(--a6);cursor:pointer}
  .nimStone.taken{opacity:.15;cursor:default}

  /* ---- progression / juice layer ---- */
  .pill{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:800;cursor:pointer;font-size:14px;font-family:inherit;flex:0 0 auto}
  .pill:hover{border-color:var(--hit)}
  .pill:focus-visible{outline:3px solid var(--decoy);outline-offset:3px}
  .pill span{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .pill svg{width:15px;height:15px}
  #fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
  .toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-40px);background:var(--ground-3);border:1px solid var(--hit);color:var(--ink);padding:10px 18px;border-radius:14px;font-weight:800;z-index:80;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none;max-width:90vw;text-align:center;font-size:15px}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
  .vign{position:fixed;inset:0;pointer-events:none;z-index:45;box-shadow:inset 0 0 110px rgba(255,92,138,.6);opacity:0}
  .vign.on{animation:vign .5s ease-out}
  @keyframes vign{0%{opacity:1}100%{opacity:0}}
  .pulse{animation:pulse .3s ease-out;display:inline-block}
  @keyframes pulse{0%{transform:scale(1.35);color:var(--hit)}100%{transform:scale(1)}}
  .floatpt{position:fixed;font-family:var(--display);font-weight:700;font-size:28px;color:var(--hit);pointer-events:none;z-index:55;animation:floatup .85s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  @keyframes floatup{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-46px) scale(1.15)}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--hit);color:var(--ground);border-color:var(--hit)}
  .daily{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 16px;background:linear-gradient(120deg,var(--ground-2),var(--ground-3))}
  .daily .card-ico{flex:0 0 46px}
  .daily .dtxt{flex:1;min-width:0}
  .daily .dtitle{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--hit)}

  // ---------- shared storage ----------

  function tone(freq, dur = .08, type = 'triangle', vol = .1, slide = 0, delay = 0) {

  }
  const muteBtn = $$('#muteBtn');

                <li><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="${C.decoy}" transform="rotate(45 12 12)"/></svg></span><span><b>יהלום טורקיז: לא לגעת!</b> <span class="sub">מוריד 1.5 שניות ושובר את הרצף.</span></span></li>

      const cv = $$('.bCv', root), ctx = cv.getContext('2d');

      let state = 'idle', targets = [], parts = [], floats = [], ambient = [], g = null;

      const THRESH = (() => { const a = [0]; for (let i = 1; i <= 30; i++) a.push(a[i - 1] + 70 + i * 30); return a; })();
      function newGame() {
        g = { score: 0, combo: 0, maxCombo: 0, hits: 0, misses: 0, decoys: 0, rt: [], timeLeft: DURATION, clock: 0, nextSpawn: 400, shake: 0, level: 1 };

    Object.entries(PERKS).forEach(([id, perk]) => {
      const d = document.createElement('div'); d.className = 'shopCard';
      d.innerHTML = `<span class="pic">${perk.icon}</span><b>${perk.name}</b><small>${perk.desc}</small><small>יש לכם: ${P.inv[id] || 0}</small><button class="btn ghost" type="button" style="padding:8px 10px;font-size:13px">קנו · ${perk.price} 🪙</button>`;
      d.querySelector('button').addEventListener('click', () => { if (buyPerk(id)) { m.remove(); openProfile(); } });
      shopG.appendChild(d);
    });
    (async () => { const uid = userApi ? await userApi.id().catch(() => null) : null; fetchLeaderboard(m.querySelector('.lbList'), uid); })();
    const tg = m.querySelector('.themes');
    Object.entries(THEMES).forEach(([id, t]) => {
      const owned = !!P.themes[id], on = P.theme === id; const d = document.createElement('div'); d.className = 'themecard' + (on ? ' on' : '');
      const cols = id === 'arcade' ? ['#221845', '#FFB020', '#35D6C8', '#FF5C8A'] : [t.v['--ground-2'], t.v['--hit'], t.v['--decoy'], t.v['--bonus']];
      d.innerHTML = `<b>${t.name}</b><div class="swrow">${cols.map(c => `<i style="background:${c}"></i>`).join('')}</div><button class="btn ghost" type="button" style="padding:8px 10px;font-size:14px">${on ? 'נבחר' : owned ? 'בחרו' : `קנו · ${t.price}`}</button>`;
      d.querySelector('button').addEventListener('click', () => {
        if (on) return;
        if (!owned) { if (P.coins < t.price) { toast('אין מספיק מטבעות', `חסרים ${t.price - P.coins}`); return; } P.coins -= t.price; P.themes[id] = 1; }
        P.theme = id; checkAch(); saveP(); updatePill(); applyTheme(id);
        try { location.reload(); } catch (e) { m.remove(); openProfile(); }
      });
      tg.appendChild(d);
    });
    const al = m.querySelector('.achlist');
    ACH.forEach(a => { const d = document.createElement('div'); d.className = 'ach' + (P.ach[a.id] ? '' : ' lock'); d.innerHTML = `<div><b>${a.name}</b><small>${a.desc}</small></div><span class="ac">${P.ach[a.id] ? '✓' : '+' + a.c}</span>`; al.appendChild(d); });
    m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    m.querySelector('.pClose').addEventListener('click', () => m.remove());
    document.body.appendChild(m);
  }
  $$('#profileBtn').addEventListener('click', openProfile);

  // =========================================================
  // router / home
  // =========================================================
  const home = $$('#home'), gameHost = $$('#gameHost'), cardGrid = $$('#cardGrid');
  const backBtn = $$('#backBtn'), titleText = $$('#titleText'), chipsEl = $$('#chips'), dailyEl = $$('#daily');
  let cleanup = null, cat = 'all';

  function renderDaily() {
    ensureDaily(); const g = dailyGame();
    dailyEl.className = 'daily' + (P.daily.done ? ' done' : '');
    dailyEl.innerHTML = `<span class="card-ico">${g.icon}</span><div class="dtxt"><div class="dtitle">האתגר היומי</div><div class="dname">${g.name}</div><div class="dsub">${P.daily.done ? `הושלם! חזרו מחר · רצף ${P.daily.streak} ימים` : `סיימו סיבוב או שברו שיא וקבלו ${50 + Math.min(P.daily.streak + 1, 7) * 5} מטבעות`}</div></div><button class="btn" type="button" style="padding:10px 18px;font-size:16px">${P.daily.done ? 'שוב' : 'שחקו'}</button>`;
    dailyEl.querySelector('button').onclick = () => openGame(g.id);
  }
  function renderChips() {
    chipsEl.innerHTML = '';
    CATS.forEach(([id, name]) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (cat === id ? ' on' : ''); b.textContent = name; b.addEventListener('click', () => { cat = id; renderChips(); renderCards(); }); chipsEl.appendChild(b); });
  }
  function renderCards() {
    cardGrid.innerHTML = '';
    const list = GAMES.filter(gm => cat === 'all' ? true : cat === 'fav' ? P.fav[gm.id] : CAT[gm.id] === cat);
    if (!list.length) { const p = document.createElement('p'); p.style.color = 'var(--muted)'; p.textContent = cat === 'fav' ? 'עוד אין מועדפים. לוחצים על הכוכב בכרטיס של משחק.' : 'אין משחקים בקטגוריה הזו.'; cardGrid.appendChild(p); return; }
    for (const gm of list) {
      const best = store.get(gm.bestKey, 0);
      const wrap = document.createElement('div'); wrap.className = 'cardwrap';
      const btn = document.createElement('button');
      btn.className = 'card-btn'; btn.type = 'button';
      btn.innerHTML = `
        <span class="card-ico">${gm.icon}</span>
        <span class="card-name">${gm.name}</span>
        <span class="card-tag">${gm.tag}</span>
        <span class="card-best">שיא <b>${gm.bestLabel(best)}</b></span>`;
      btn.addEventListener('click', () => openGame(gm.id));
      const fav = document.createElement('button'); fav.type = 'button'; fav.className = 'favbtn' + (P.fav[gm.id] ? ' on' : ''); fav.setAttribute('aria-label', 'מועדף');
      fav.innerHTML = `<svg viewBox="0 0 24 24" fill="${P.fav[gm.id] ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>`;
      fav.addEventListener('click', e => { e.stopPropagation(); P.fav[gm.id] = !P.fav[gm.id]; saveP(); renderCards(); });
      wrap.appendChild(btn); wrap.appendChild(fav);
      if (!P.seen[gm.id]) { const nb = document.createElement('span'); nb.className = 'newbadge'; nb.textContent = 'חדש'; wrap.appendChild(nb); }
      cardGrid.appendChild(wrap);
    }
  }
  function renderHome() { renderDaily(); renderChips(); renderCards(); updatePill(); }
  function openGame(id) {
    const gm = GAMES.find(x => x.id === id); if (!gm) return;
    if (cleanup) { cleanup(); cleanup = null; }
    currentGameId = id;
    home.hidden = true; gameHost.hidden = false; gameHost.innerHTML = '';
    titleText.textContent = gm.name; backBtn.hidden = false;
    cleanup = gm.mount(gameHost);
    onOpen(id);
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  }
  function goHome() {
    if (cleanup) { cleanup(); cleanup = null; }
    currentGameId = null;
    gameHost.hidden = true; gameHost.innerHTML = ''; home.hidden = false;
    titleText.textContent = 'המשחקייה'; backBtn.hidden = true;
    renderHome();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }
  backBtn.addEventListener('click', goHome);

  watchGame();
  ensureDaily(); renderHome();
  const startId = location.hash.slice(1);
  if (GAMES.some(g => g.id === startId)) openGame(startId);
})();
</script>

</body></html>
