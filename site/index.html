<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shneyor Games</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --fg: #171a21; --muted: #5c6370; --card: #fff; --line: #dfe2e8; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --fg: #eceef2; --muted: #9aa1ad; --card: #1b1f28; --line: #2b313d; --accent: #6fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 24px; font-size: 2rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  a.game { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); }
  a.game strong { display: block; color: var(--accent); font-size: 1.1rem; }
  a.game span { color: var(--muted); font-size: .9rem; }
  p.empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Shneyor Games</h1>
  <ul id="games"></ul>
  <p class="empty" id="empty" hidden>No games yet.</p>
</main>
<script>
  fetch('games.json').then(r => r.json()).catch(() => []).then(games => {
    const list = document.getElementById('games');
    document.getElementById('empty').hidden = games.length > 0;
    for (const g of games) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'game';
      a.href = g.slug + '/';
      const name = document.createElement('strong');
      name.textContent = g.name;
      const desc = document.createElement('span');
      desc.textContent = g.description || '';
      a.append(name, desc);
      li.append(a);
      list.append(li);
    }
  });
</script>
</body>
</html>
